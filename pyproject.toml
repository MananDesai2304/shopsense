[project]
name = "shopsense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
]
[tool.ruff]
src = ["apps/api/src"]

[tool.pytest.ini_options]
addopts = '-m "not wands"'
markers = ["wands: needs the real WANDS file at data/wands/product.csv (run with -m wands)"]
